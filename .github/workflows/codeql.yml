# Análisis estático de seguridad (Python del servidor y JavaScript de la interfaz).
# Los resultados salen en la pestaña Security → Code scanning del repositorio.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # lunes de madrugada, por si aparecen reglas nuevas

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - static/vendor
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
