[sssd]
config_file_version = 2
services = nss, pam
domains = lpic.lab

[domain/lpic.lab]
id_provider = ldap
auth_provider = ldap
chpass_provider = ldap
ldap_uri = ldap://ldap-srv
ldap_search_base = dc=lpic,dc=lab
ldap_id_use_start_tls = true
ldap_tls_cacert = /etc/ldap/tls/ca.crt
ldap_tls_reqcert = demand
cache_credentials = true
enumerate = true
ldap_user_search_base = ou=personas,dc=lpic,dc=lab
ldap_group_search_base = ou=grupos,dc=lpic,dc=lab
